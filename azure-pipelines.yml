# ─────────────────────────────────────────
# azure-pipelines.yml
# Complete CI/CD Pipeline
# Triggers on push to develop or main
# 5 Stages: Terraform, Test, Sonar,
#           Docker, Deploy
# ─────────────────────────────────────────

trigger:
  branches:
    include:
      - develop
      - main

variables:
  # Azure details
  azureServiceConnection: 'azure-rm-connection'
  resourceGroupName: 'rg-cicd-poc-dev'
  aksClusterName: 'aks-cicd-poc-dev'
  acrName: 'acrcicdpocdev'
  acrLoginServer: 'acrcicdpocdev.azurecr.io'
  imageRepository: 'flask-app'
  keyVaultUrl: 'https://kv-cicd-poc-dev.vault.azure.net/'

  # SonarCloud details
  sonarCloudOrganization: 'mohanazure7'
  sonarCloudProjectKey: 'mohanazure7_zero-trust-poc'
  sonarCloudProjectName: 'zero-trust-poc'
  sonarServiceConnection: 'sonarcloud-connection'

  # Build details
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

# ─────────────────────────────────────────
# STAGE 1 — TERRAFORM
# Creates/updates all Azure resources
# ─────────────────────────────────────────
stages:
- stage: Terraform
  displayName: 'Stage 1 - Terraform Apply'
  jobs:
  - job: TerraformApply
    displayName: 'Terraform Init and Apply'
    pool:
      name: 'Default'
    steps:

    - task: TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(Build.SourcesDirectory)/terraform'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: '$(resourceGroupName)'
        backendAzureRmStorageAccountName: 'stterraformpocdev'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'dev.terraform.tfstate'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Apply'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(Build.SourcesDirectory)/terraform'
        commandOptions: '-auto-approve'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'

# ─────────────────────────────────────────
# STAGE 2 — BUILD AND TEST
# Install dependencies and run pytest
# ─────────────────────────────────────────
- stage: BuildAndTest
  displayName: 'Stage 2 - Build and Test'
  dependsOn: Terraform
  jobs:
  - job: RunTests
    displayName: 'Install and Run Tests'
    pool:
      name: 'Default'
    steps:
    - script: |
        pip install -r app/requirements.txt
      displayName: 'Install dependencies'

    - script: |
        pip install pytest pytest-cov
        pytest app/tests/ \
          --junitxml=test-results.xml \
          --cov=app \
          --cov-report=xml:coverage.xml \
          -v
      displayName: 'Run pytest with coverage'

    - task: PublishTestResults@2
      displayName: 'Publish test results'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'test-results.xml'
        failTaskOnFailedTests: true

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish coverage results'
      condition: always()
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: 'coverage.xml'

    - task: PublishPipelineArtifact@1
      displayName: 'Upload coverage.xml as pipeline artifact'
      condition: always()
      inputs:
        targetPath: 'coverage.xml'
        artifact: 'coverage-report'
        publishLocation: 'pipeline'

# ─────────────────────────────────────────
# STAGE 3 — SONARCLOUD
# Code quality and security analysis
# ─────────────────────────────────────────
- stage: SonarCloud
  displayName: 'Stage 3 - SonarCloud Analysis'
  dependsOn: BuildAndTest
  jobs:
  - job: SonarAnalysis
    displayName: 'Run SonarCloud Analysis'
    pool:
      name: 'Default'
    steps:

    

    - download: current
      displayName: 'Download coverage.xml from Stage 2'
      artifact: 'coverage-report'
      patterns: 'coverage.xml'

    - task: SonarCloudPrepare@3
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: '$(sonarServiceConnection)'
        organization: '$(sonarCloudOrganization)'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: '$(sonarCloudProjectKey)'
        cliProjectName: '$(sonarCloudProjectName)'
        extraProperties: |
          sonar.python.coverage.reportPaths=coverage.xml
          sonar.sources=app
          sonar.exclusions=app/tests/**

    - task: SonarCloudAnalyze@3
      displayName: 'Run SonarCloud Analysis'

    - task: SonarCloudPublish@3
      displayName: 'Publish Quality Gate Result'
      inputs:
        pollingTimeoutSec: '300'

# ─────────────────────────────────────────
# STAGE 4 — DOCKER
# Build image and push to ACR
# ─────────────────────────────────────────
- stage: Docker
  displayName: 'Stage 4 - Docker Build and Push'
  dependsOn: SonarCloud
  jobs:
  - job: DockerBuildPush
    displayName: 'Build and Push Docker Image'
    pool:
      name: 'Default'
    steps:

    - task: AzureCLI@2
      displayName: 'Login to ACR'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az acr login --name $(acrName)

    - task: Docker@2
      displayName: 'Build Docker image'
      inputs:
        command: 'build'
        dockerfile: '$(dockerfilePath)'
        repository: '$(acrLoginServer)/$(imageRepository)'
        tags: |
          $(tag)
          latest

    - task: Docker@2
      displayName: 'Push Docker image to ACR'
      inputs:
        command: 'push'
        repository: '$(acrLoginServer)/$(imageRepository)'
        tags: |
          $(tag)
          latest

# ─────────────────────────────────────────
# STAGE 5 — DEPLOY TO AKS
# Apply K8s manifests and verify
# ─────────────────────────────────────────
- stage: Deploy
  displayName: 'Stage 5 - Deploy to AKS'
  dependsOn: Docker
  jobs:
  - job: DeployToAKS
    displayName: 'Deploy to AKS'
    pool:
      name: 'Default'
    steps:

    - task: AzureCLI@2
      displayName: 'Get AKS credentials'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials \
            --resource-group $(resourceGroupName) \
            --name $(aksClusterName) \
            --overwrite-existing

    - task: AzureCLI@2
      displayName: 'Inject Managed Identity Client ID into serviceaccount.yaml'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          CLIENT_ID=$(az identity show \
            --resource-group $(resourceGroupName) \
            --name id-cicd-poc-dev \
            --query clientId -o tsv)
          sed -i "s/__MANAGED_IDENTITY_CLIENT_ID__/$CLIENT_ID/" k8s/serviceaccount.yaml
          echo "Injected Client ID: $CLIENT_ID"
          sed -i "s|__KEY_VAULT_URL__|$(keyVaultUrl)|" k8s/deployment.yaml
          echo "Injected Key Vault URL: $(keyVaultUrl)"

    - task: KubernetesManifest@1
      displayName: 'Deploy Service Account'
      inputs:
        action: 'deploy'
        connectionType: 'azureResourceManager'
        azureSubscriptionConnection: '$(azureServiceConnection)'
        azureResourceGroup: '$(resourceGroupName)'
        kubernetesCluster: '$(aksClusterName)'
        manifests: 'k8s/serviceaccount.yaml'

    - task: KubernetesManifest@1
      displayName: 'Deploy to AKS'
      inputs:
        action: 'deploy'
        connectionType: 'azureResourceManager'
        azureSubscriptionConnection: '$(azureServiceConnection)'
        azureResourceGroup: '$(resourceGroupName)'
        kubernetesCluster: '$(aksClusterName)'
        manifests: |
          k8s/deployment.yaml
          k8s/service.yaml
        containers: |
          $(acrLoginServer)/$(imageRepository):$(tag)

    - task: AzureCLI@2
      displayName: 'Verify deployment'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials \
            --resource-group $(resourceGroupName) \
            --name $(aksClusterName) \
            --overwrite-existing
          kubectl rollout status deployment/flask-app
          echo "Getting public IP..."
          kubectl get service flask-app-service

